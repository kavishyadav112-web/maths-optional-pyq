<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UPSC Maths Optional PYQ Practice</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font-family:Georgia,serif}.wrap{max-width:1050px;margin:auto;padding:18px}.hero{background:#172033;color:white;padding:24px;border-radius:14px;margin-bottom:15px}.hero h1{margin:0 0 6px;font-size:25px}.hero p{margin:0;font:14px system-ui;opacity:.85}.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 3px 16px #0001}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px}select,input{width:100%;padding:11px;border:1px solid #ccd3df;border-radius:8px;font:15px system-ui}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.btn{border:0;border-radius:8px;padding:11px 15px;background:#172033;color:#fff;font:14px system-ui}.light{background:#edf1f7;color:#172033}.q{display:block;border:1px solid #dfe3ea;border-radius:9px;padding:13px;margin:8px 0;cursor:pointer;font-size:16px}.q:hover{background:#fafbff}.q input{width:auto;margin-right:8px}.meta{display:block;margin:6px 0 0 25px;color:#687386;font:13px system-ui}.status{font:14px system-ui;color:#687386;margin-top:12px}.print{display:none}.page{page-break-after:always;min-height:270mm;padding:12mm}.page:last-child{page-break-after:auto}.head{text-align:center;font-family:system-ui;margin-bottom:30px}.head h1{font-size:20px;margin:0 0 5px}.sub{font-size:13px;color:#555}.question{font-size:17px;line-height:1.6}.marks{text-align:right;font:13px system-ui;margin-top:18px}.answer{text-align:center;font:700 18px system-ui}.lines{height:225mm;margin-top:25px;border-top:1px solid #ccc;background:repeating-linear-gradient(to bottom,transparent 0,transparent 9mm,#ddd 9.1mm)}@media print{.no-print,.hero{display:none!important}.print{display:block}.wrap{padding:0;max-width:none}@page{size:A4;margin:0}} </style></head><body><div class="wrap"><div class="hero"><h1>UPSC Mathematics Optional — Chapterwise PYQ Practice</h1><p>CSE + IFoS · Select exact PYQs · Generate a question-cum-answer booklet</p></div><div class="card no-print"><div class="controls"><select id="exam"><option>CSE</option><option>IFoS</option></select><select id="chapter"><option>Linear Algebra</option><option>Calculus</option><option>Analytical Geometry</option><option>ODE</option><option>Statics & Dynamics</option><option>Vector Analysis</option><option>Algebra</option><option>Real Analysis</option><option>Complex Analysis</option><option>Linear Programming</option><option>PDE</option><option>Numerical Analysis & Computer Programming</option><option>Mechanics & Fluid Dynamics</option><option>Hydrostatics</option></select><select id="year"><option>2025</option><option>2024</option><option>2023</option><option>2022</option><option>2021</option><option>2020</option><option>2019</option><option>2018</option><option>2017</option><option>2016</option><option>2015</option><option>2014</option><option>2013</option></select><select id="paper"><option>Paper I</option><option>Paper II</option></select></div><input id="search" placeholder="Search question..." style="margin-top:9px"><div class="actions"><button class="btn light" onclick="allq()">Select all shown</button><button class="btn light" onclick="clearq()">Clear</button><button class="btn" onclick="makePDF()">Generate Question + Answer PDF</button></div><div id="status" class="status"></div><div id="questions"></div><div id="note" class="status"></div></div><div id="output" class="print"></div></div><script>const D={CSE:{'Linear Algebra':{'2025':{'Paper I':[['Q1(a)','Can the set {(0, 0, 0, 3), (1, 1, 0, 0), (0, 1, −1, 0)} be extended to form a basis of the vector space R⁴? Justify your answer.','10'],['Q1(b)','Find the range, rank, kernel and nullity of the linear transformation T : R⁴ → R³ given by T(x, y, z, w) = (x − w, y + z, z − w).','10'],['Q2(a)','Let T : R³ → R² be a linear transformation such that T(1, 1, −1) = (1, 0), T(4, 1, 1) = (0, 1) and T(1, −1, 2) = (1, 1). Find T.','15'],['Q3(a)','Reduce the given matrix to row-echelon form and use it to determine its rank.','15'],['Q4(c)(i)','Find the eigenvalues and eigenvectors of the given matrix.','12'],['Q4(c)(ii)','Let V be a vector space and W a subspace. Describe the quotient vector space V/W and determine its dimension in the stated case.','8']]}}}};let S=new Set(),$=x=>document.getElementById(x);function key(x){return [$('exam').value,$('chapter').value,$('year').value,$('paper').value,x[0]].join('|')}function get(){return (((D[$('exam').value]||{})[$('chapter').value]||{})[$('year').value]||{})[$('paper').value]||[])}function render(){let s=$('search').value.toLowerCase(),d=get(),a=d.filter(x=>(x[0]+' '+x[1]).toLowerCase().includes(s));$('questions').innerHTML=a.length?a.map(x=>`<label class=q><input type=checkbox ${S.has(key(x))?'checked':''} onchange="tog('${encodeURIComponent(key(x))}')"><b>${x[0]}</b> ${x[1]}<span class=meta>${$('exam').value} · ${$('chapter').value} · ${$('year').value} · ${$('paper').value} · ${x[2]} marks</span></label>`).join(''):'<div class=status>No exact question text is loaded for this combination yet. The database is being populated from the PYQ sources.</div>';$('status').textContent=S.size+' question(s) selected';$('note').textContent=d.length?'Exact wording is preserved for the loaded questions.':'Select a loaded chapter/year.'}function tog(v){v=decodeURIComponent(v);S.has(v)?S.delete(v):S.add(v);render()}function allq(){get().forEach(x=>S.add(key(x)));render()}function clearq(){S.clear();render()}function makePDF(){let c=get().filter(x=>S.has(key(x)));if(!c.length)return alert('Select at least one question.');let h=`<div class=page><div class=head><h1>UPSC Mathematics Optional</h1><div class=sub>${$('exam').value} · ${$('chapter').value} · ${$('year').value} · ${$('paper').value}</div></div><p style="text-align:center;font:14px system-ui">Question-cum-Answer Practice Booklet</p></div>`;c.forEach(x=>h+=`<div class=page><div class=head><h1>UPSC Mathematics Optional</h1><div class=sub>${$('exam').value} · ${$('chapter').value} · ${$('year').value} · ${$('paper').value}</div></div><div class=question><b>${x[0]}</b><br>${x[1]}</div><div class=marks>[${x[2]} Marks]</div></div><div class=page><div class=answer>ANSWER / PRACTICE</div><div class=sub style="text-align:center">${$('exam').value} · ${$('chapter').value} · ${$('year').value} · ${x[0]}</div><div class=lines></div></div>`);$('output').innerHTML=h;window.print()}['exam','chapter','year','paper'].forEach(x=>$(x).onchange=()=>{S.clear();render()});$('search').oninput=render;render();</script></body></html>
