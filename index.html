<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UPSC Maths Optional PYQ Generator</title><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#f4f6fa;color:#172033}.wrap{max-width:1100px;margin:auto;padding:20px 14px}.hero{background:linear-gradient(135deg,#172033,#344767);color:#fff;border-radius:20px;padding:24px;margin-bottom:16px}.hero h1{margin:0 0 7px}.hero p{margin:0;opacity:.85}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 3px 18px #0000000d}.controls{display:flex;gap:9px;flex-wrap:wrap}select,input{padding:11px 12px;border:1px solid #ccd3df;border-radius:9px;background:#fff;font-size:15px}input{flex:1;min-width:170px}.questions{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:9px;margin-top:15px}.q{border:1px solid #dce1ea;border-radius:11px;padding:12px;background:#fafbfe;cursor:pointer}.q:hover{border-color:#8398ca}.q input{min-width:auto;flex:none;margin-right:8px}.q small{display:block;color:#687386;margin:5px 0 0 25px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:9px;padding:11px 15px;background:#172033;color:#fff;cursor:pointer}.btn.alt{background:#eef2ff;color:#172033}.count{color:#687386}.paper{margin-top:16px;border-top:1px solid #eee;padding-top:15px}.paper-item{padding:11px;border:1px solid #e1e5ec;border-radius:9px;margin:7px 0}.print{display:none}@media print{body{background:#fff}.no-print{display:none!important}.print{display:block}.print h1{font-size:22px}.paper-item{break-inside:avoid;border:0;border-bottom:1px solid #ddd;border-radius:0;padding:12px 0}}</style></head><body><div class="wrap"><div class="hero"><h1>UPSC Mathematics Optional PYQ Generator</h1><p>Choose individual sub-questions and build your own practice paper.</p></div><div class="card no-print"><div class="controls"><select id="year"><option>2025</option><option>2026</option><option>2024</option><option>2023</option><option>2022</option><option>2021</option><option>2020</option><option>2019</option><option>2018</option><option>2017</option><option>2016</option><option>2015</option><option>2014</option><option>2013</option></select><select id="paper"><option value="1">Paper I</option><option value="2">Paper II</option></select><input id="search" placeholder="Search question number/topic..."></div><div class="actions"><button class="btn alt" onclick="selectAll()">Select all shown</button><button class="btn alt" onclick="clearAll()">Clear</button><button class="btn" onclick="generate()">Generate Practice Paper</button></div><div id="status" class="count" style="margin-top:12px"></div><div id="questions" class="questions"></div><div id="note" class="count" style="margin-top:14px"></div></div><div class="card print" id="output"></div></div><script>
const source='https://www.upsc.gov.in/examinations/previous-question-papers';
const q2025={1:[['1(a)','Extension to a basis'],['1(b)','Range, rank, kernel and nullity'],['1(c)','Maximum volume of an open box'],['1(d)','Functional equation'],['1(e)','Cone through a guiding curve'],['2(a)','Linear transformation'],['2(b)','Mean Value Theorem'],['2(c)(i)','Cylinder with parallel generators'],['2(c)(ii)','Shortest distance between lines'],['3(a)','Matrix echelon form'],['3(b)','Spheres through a circle'],['3(c)(i)','Double integral'],['3(c)(ii)','Triple integral'],['4(a)','Sphere and tangent plane'],['4(b)','Mixed partial derivatives'],['4(c)(i)','Eigenvalues and eigenvectors'],['4(c)(ii)','Quotient vector space'],['5(a)','First order differential equation'],['5(b)','Differential equation of ellipses'],['5(c)','Kepler and areal law'],['5(d)','Cauchy-Euler type differential equation'],['5(e)','Vector calculus'],['6(a)','Laplace convolution theorem'],['6(b)','Elastic string motion'],['6(c)(i)','Directional derivative'],['6(c)(ii)','Vector wave equations'],['7(a)','Stable equilibrium of a sphere in a bowl'],['7(b)','Green theorem'],['7(c)(i)','General and singular solution'],['7(c)(ii)','Cauchy-Euler equation'],['8(a)','Variation of parameters'],['8(b)','Dynamics / central force'],['8(c)','Vector analysis']] ,2:[['1(a)','Subgroups and order'],['1(b)','Non-abelian group of order six'],['1(c)','Ring / field theory'],['1(d)','Real analysis'],['1(e)','Basic solutions of linear equations'],['2(a)','Cauchy sequence'],['2(b)','Real analysis'],['2(c)','Algebra / analysis'],['3(a)','Residue theorem'],['3(b)','Complex analysis'],['3(c)','Linear programming'],['4(a)','Modern algebra'],['4(b)','Real analysis'],['4(c)','Complex analysis'],['5(a)','Linear PDE with constant coefficients'],['5(b)','Partial differential equations'],['5(c)(i)','PDE / characteristics'],['5(c)(ii)','PDE'],['6(a)','Laplace equation on a rectangle'],['6(b)','Numerical analysis'],['6(c)','Numerical methods'],['7(a)','Complete integral of first-order PDE'],['7(b)','Numerical analysis'],['7(c)','Fluid dynamics'],['8(a)','Characteristics of first-order PDE'],['8(b)','Fluid dynamics'],['8(c)(i)','Mechanics'],['8(c)(ii)','Fluid dynamics']]};
let selected=new Set();const els={year:document.getElementById('year'),paper:document.getElementById('paper'),search:document.getElementById('search'),questions:document.getElementById('questions'),status:document.getElementById('status'),note:document.getElementById('note'),output:document.getElementById('output')};
function data(){return Number(els.year.value)===2025?q2025[els.paper.value]:null}function render(){const d=data();const term=els.search.value.toLowerCase();if(!d){els.questions.innerHTML='';els.note.textContent='Question-level index is currently verified for 2025. Other years remain available through the official UPSC paper links. We can add them year-by-year.';els.status.textContent='';return}const shown=d.filter(x=>(x[0]+' '+x[1]).toLowerCase().includes(term));els.questions.innerHTML=shown.map((x,i)=>{const id=els.year.value+'-'+els.paper.value+'-'+x[0];return `<label class="q"><input type="checkbox" ${selected.has(id)?'checked':''} onchange="toggle('${id}')"><b>${x[0]}</b> — ${x[1]}<small>2025 Paper ${els.paper.value}</small></label>`}).join('');els.status.textContent=`${selected.size} selected`;els.note.textContent='The question labels/topics are an index for practice selection. Open the official UPSC paper for the exact original wording.'}function toggle(id){selected.has(id)?selected.delete(id):selected.add(id);render()}function selectAll(){const d=data()||[];const term=els.search.value.toLowerCase();d.filter(x=>(x[0]+' '+x[1]).toLowerCase().includes(term)).forEach(x=>selected.add(els.year.value+'-'+els.paper.value+'-'+x[0]));render()}function clearAll(){selected.clear();render()}function generate(){const d=data()||[];const chosen=d.filter(x=>selected.has(els.year.value+'-'+els.paper.value+'-'+x[0]));if(!chosen.length){alert('Select at least one sub-question.');return}els.output.innerHTML=`<h1>UPSC Mathematics Optional — Practice Paper</h1><p>Year: ${els.year.value} · Paper ${els.paper.value}</p><p>Selected sub-questions: ${chosen.length}</p>`+chosen.map(x=>`<div class="paper-item"><b>${x[0]}</b> — ${x[1]}<br><small>Original wording: see the official UPSC paper.</small></div>`).join('')+`<p style="margin-top:25px">Official source: ${source}</p>`;window.print()}els.year.onchange=()=>{selected.clear();render()};els.paper.onchange=()=>{selected.clear();render()};els.search.oninput=render;render();</script></body></html>
