<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UPSC Mathematics Optional PYQ Hub</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:28px 18px}.card{background:white;border-radius:16px;padding:24px;box-shadow:0 4px 20px #0001}h1{margin-top:0}select,input{padding:12px;border:1px solid #ccd3df;border-radius:10px;margin:5px}button{padding:12px 18px;border:0;border-radius:10px;background:#172033;color:white;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:18px 0}.year{padding:14px;border:1px solid #d8deea;border-radius:12px;background:#fafbfe;cursor:pointer}.year:hover{background:#eef2ff}.muted{color:#687386}.list{margin-top:20px}.paper{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #eee}</style></head><body><div class="wrap"><div class="card"><h1>UPSC Mathematics Optional PYQ Hub</h1><p class="muted">Year-wise previous-year question papers for Mathematics Optional.</p><div><select id="paper"><option value="all">Both Papers</option><option value="1">Paper I</option><option value="2">Paper II</option></select><input id="search" placeholder="Search year..."></div><div id="years" class="grid"></div><div id="list" class="list"></div></div></div><script>const years=Array.from({length:14},(_,i)=>2026-i);const root=document.getElementById('years'),list=document.getElementById('list');function render(){const q=document.getElementById('search').value.trim();root.innerHTML=years.filter(y=>!q||String(y).includes(q)).map(y=>`<div class="year" onclick="show(${y})"><b>${y}</b><br><span class="muted">Paper I & Paper II</span></div>`).join('')}function show(y){list.innerHTML=`<h2>${y}</h2>`+[1,2].map(p=>`<div class="paper"><span>Mathematics Optional — Paper ${p}</span><a href="https://www.upsc.gov.in/examinations/previous-question-papers" target="_blank"><button>Official UPSC</button></a></div>`).join('')}document.getElementById('search').oninput=render;document.getElementById('paper').onchange=render;render();</script></body></html>
