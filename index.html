<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UPSC Mathematics Optional PYQ Generator</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.hero{background:#172033;color:#fff;padding:28px;border-radius:16px;margin-bottom:16px}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;font-size:15px;line-height:1.5;opacity:.9}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 3px 16px #0001}.controls{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}select,input{width:100%;padding:13px;border:1px solid #ccd3df;border-radius:10px;font-size:16px;background:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.btn{border:0;border-radius:10px;padding:13px 17px;background:#172033;color:#fff;font-size:15px;cursor:pointer}.light{background:#edf1f7;color:#172033}.q{display:block;border:1px solid #dfe3ea;border-radius:10px;padding:15px;margin:9px 0;cursor:pointer;font-size:16px;line-height:1.55}.q input{width:auto;margin-right:8px}.meta{display:block;margin:6px 0 0 25px;color:#687386;font-size:13px}.status{font-size:14px;color:#687386;margin-top:10px}.print{display:none}.page{page-break-after:always;min-height:270mm;padding:15mm}.page:last-child{page-break-after:auto}.head{text-align:center;margin-bottom:35px}.head h1{font-size:21px;margin:0 0 7px}.sub{font-size:13px;color:#555}.question{font-size:18px;line-height:1.7}.marks{text-align:right;font-size:14px;margin-top:20px}.answer{text-align:center;font-weight:bold;font-size:19px}.lines{height:225mm;margin-top:25px;border-top:1px solid #ccc;background:repeating-linear-gradient(to bottom,transparent 0,transparent 9mm,#ddd 9.1mm)}@media(max-width:700px){.controls{grid-template-columns:1fr}.hero h1{font-size:27px}}@media print{.no-print,.hero{display:none!important}.print{display:block}.wrap{padding:0;max-width:none}@page{size:A4;margin:0}}</style></head><body><div class="wrap"><div class="hero"><h1>UPSC Mathematics Optional PYQ Generator</h1><p>CSE + IFoS · Chapterwise · Year-wise · Select individual PYQs · Generate a question-cum-answer practice booklet</p></div><div class="card no-print"><div class="controls"><select id="exam"></select><select id="chapter"></select><select id="year"></select><select id="paper"><option value="ALL">All questions</option></select></div><input id="search" placeholder="Search question number / topic..." style="margin-top:10px"><div class="actions"><button class="btn light" id="all">Select all shown</button><button class="btn light" id="clear">Clear</button><button class="btn" id="generate">Generate Practice Paper</button></div><div id="status" class="status"></div><div id="questions"></div><div class="status">Database loaded from the uploaded IMS CSE/IFoS chapter-wise PYQ compilation. Only questions actually extracted from that source are shown.</div></div><div id="output" class="print"></div></div><script>const DATA=__DATA__;const CHAPTERS={CSE:Object.keys(DATA.CSE),IFoS:Object.keys(DATA.IFoS)};let selected=new Set();const $=id=>document.getElementById(id);function fillExams(){$('exam').innerHTML=Object.keys(DATA).map(x=>`<option>${x}</option>`).join('');fillChapters()}function fillChapters(){let e=$('exam').value;$('chapter').innerHTML=CHAPTERS[e].map(x=>`<option>${x}</option>`).join('');fillYears()}function getRows(){let e=$('exam').value,c=$('chapter').value,y=$('year').value;return(DATA[e][c]||[]).filter(r=>r[0]===y)}function fillYears(){let e=$('exam').value,c=$('chapter').value;let ys=[...new Set(DATA[e][c].map(r=>r[0]))].sort((a,b)=>+b-+a);$('year').innerHTML=ys.map(y=>`<option>${y}</option>`).join('');selected.clear();render()}function render(){let term=$('search').value.toLowerCase();let rows=getRows().filter(r=>r[2].toLowerCase().includes(term)||r[0].includes(term));$('questions').innerHTML=rows.length?rows.map((r,i)=>`<label class="q"><input type="checkbox" data-i="${i}" ${selected.has(r[0]+'|'+r[2])?'checked':''}><b>${r[0]}</b> ${r[2]}<span class="meta">${$('exam').value} · ${$('chapter').value} · ${r[1]?r[1]+' marks':''}</span></label>`).join(''):'<div class="status">No questions are loaded for this selection.</div>';$('status').textContent=selected.size+' question(s) selected';document.querySelectorAll('.q input').forEach(cb=>cb.onchange=()=>{let r=rows[+cb.dataset.i],k=r[0]+'|'+r[2];cb.checked?selected.add(k):selected.delete(k);$('status').textContent=selected.size+' question(s) selected'})}function all(){getRows().forEach(r=>selected.add(r[0]+'|'+r[2]));render()}function clear(){selected.clear();render()}function generate(){let rows=getRows().filter(r=>selected.has(r[0]+'|'+r[2]));if(!rows.length){alert('Select at least one question.');return}let h='';rows.forEach(r=>{h+=`<div class="page"><div class="head"><h1>UPSC Mathematics Optional</h1><div class="sub">${$('exam').value} · ${$('chapter').value} · ${$('year').value}</div></div><div class="question"><b>${r[0]}</b><br>${r[2]}</div>${r[1]?`<div class="marks">[${r[1]} Marks]</div>`:''}</div><div class="page"><div class="answer">ANSWER / PRACTICE</div><div class="sub" style="text-align:center">${$('exam').value} · ${$('chapter').value} · ${$('year').value} · ${r[0]}</div><div class="lines"></div></div>`});$('output').innerHTML=h;window.print()}$('exam').onchange=fillChapters;$('chapter').onchange=fillYears;$('year').onchange=()=>{selected.clear();render()};$('search').oninput=render;$('all').onclick=all;$('clear').onclick=clear;$('generate').onclick=generate;fillExams();</script></body></html>
