<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UPSC Mathematics Optional PYQ Generator</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.hero{background:#172033;color:#fff;padding:28px;border-radius:16px;margin-bottom:16px}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;font-size:15px;line-height:1.5}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 3px 16px #0001}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}select,input{width:100%;padding:13px;border:1px solid #ccd3df;border-radius:10px;font-size:16px;background:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.btn{border:0;border-radius:10px;padding:13px 17px;background:#172033;color:#fff;font-size:15px;cursor:pointer}.light{background:#edf1f7;color:#172033}.q{display:block;border:1px solid #dfe3ea;border-radius:10px;padding:15px;margin:9px 0;cursor:pointer;font-size:16px;line-height:1.55}.q input{width:auto;margin-right:8px}.meta{display:block;margin:6px 0 0 25px;color:#687386;font-size:13px}.status{font-size:14px;color:#687386;margin-top:10px}.print{display:none}.page{page-break-after:always;min-height:270mm;padding:15mm}.page:last-child{page-break-after:auto}.head{text-align:center;margin-bottom:35px}.head h1{font-size:21px;margin:0 0 7px}.sub{font-size:13px;color:#555}.question{font-size:18px;line-height:1.7}.marks{text-align:right;font-size:14px;margin-top:20px}.answer{text-align:center;font-weight:bold;font-size:19px}.lines{height:225mm;margin-top:25px;border-top:1px solid #ccc;background:repeating-linear-gradient(to bottom,transparent 0,transparent 9mm,#ddd 9.1mm)}@media(max-width:700px){.controls{grid-template-columns:1fr}}@media print{.no-print,.hero{display:none!important}.print{display:block}.wrap{padding:0;max-width:none}@page{size:A4;margin:0}}</style></head><body><div class="wrap"><div class="hero"><h1>UPSC Mathematics Optional PYQ Generator</h1><p>CSE + IFoS · Chapterwise · Year-wise · Select individual PYQs · Generate a question-cum-answer practice booklet</p></div><div class="card no-print"><div class="controls"><select id="exam"></select><select id="chapter"></select><select id="year"></select><select id="paper"></select></div><input id="search" placeholder="Search question number / topic..." style="margin-top:10px"><div class="actions"><button class="btn light" id="allBtn">Select all shown</button><button class="btn light" id="clearBtn">Clear</button><button class="btn" id="generateBtn">Generate Practice Paper</button></div><div id="status" class="status"></div><div id="questions"></div><div id="dbStatus" class="status"></div></div><div id="output" class="print"></div></div><script src="data.js"></script><script>
(function(){
const DATA=window.PYQ_DATA||{};const exam=document.getElementById('exam'),chapter=document.getElementById('chapter'),year=document.getElementById('year'),paper=document.getElementById('paper'),search=document.getElementById('search'),questions=document.getElementById('questions'),status=document.getElementById('status'),dbStatus=document.getElementById('dbStatus');let selected=new Set();
function opts(el,vals){el.innerHTML='';vals.forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;el.appendChild(o)})}
function exams(){return Object.keys(DATA)}
function chapters(){return Object.keys(DATA[exam.value]||{})}
function years(){return Object.keys((DATA[exam.value]||{})[chapter.value]||{}).sort((a,b)=>+b-+a)}
function get(){return (((DATA[exam.value]||{})[chapter.value]||{})[year.value]||[])}
function setPaper(){let p=(chapter.value==='Complex Analysis'||chapter.value==='Linear Programming'||chapter.value==='Modern Algebra'||chapter.value==='Numerical Analysis'||chapter.value==='Computer Programming'||chapter.value==='Partial Differential Equations')?'Paper II':'Paper I';opts(paper,[p])}
function render(){let list=get(),term=search.value.trim().toLowerCase();questions.innerHTML='';let shown=0;list.forEach((q,i)=>{if(term&&!(q.q+' '+q.id).toLowerCase().includes(term))return;shown++;let lab=document.createElement('label');lab.className='q';let cb=document.createElement('input');cb.type='checkbox';cb.checked=selected.has(q.id);cb.onchange=()=>{cb.checked?selected.add(q.id):selected.delete(q.id);status.textContent=selected.size+' question(s) selected'};lab.appendChild(cb);let b=document.createElement('b');b.textContent='Q'+(i+1)+' ';lab.appendChild(b);lab.appendChild(document.createTextNode(q.q));let meta=document.createElement('span');meta.className='meta';meta.textContent=exam.value+' · '+chapter.value+' · '+year.value+' · '+paper.value+(q.marks?' · '+q.marks+' Marks':'');lab.appendChild(meta);questions.appendChild(lab)});status.textContent=selected.size+' question(s) selected · '+shown+' shown';if(!shown)questions.innerHTML='<div class="status">No questions found for this selection.</div>'}
function rebuildChapter(){opts(chapter,chapters());rebuildYear()}
function rebuildYear(){opts(year,years());setPaper();selected.clear();render()}
exam.onchange=rebuildChapter;chapter.onchange=rebuildYear;year.onchange=()=>{setPaper();selected.clear();render()};search.oninput=render;document.getElementById('allBtn').onclick=()=>{get().forEach(q=>selected.add(q.id));render()};document.getElementById('clearBtn').onclick=()=>{selected.clear();render()};document.getElementById('generateBtn').onclick=()=>{let chosen=get().filter(q=>selected.has(q.id));if(!chosen.length){alert('Select at least one question.');return}let h='';chosen.forEach((q,i)=>{h+='<div class="page"><div class="head"><h1>UPSC Mathematics Optional</h1><div class="sub">'+exam.value+' · '+chapter.value+' · '+year.value+' · '+paper.value+'</div></div><div class="question"><b>Q'+(i+1)+'</b><br>'+q.q.replace(/\n/g,'<br>')+'</div><div class="marks">'+(q.marks?'['+q.marks+']':'')+'</div></div><div class="page"><div class="answer">ANSWER / PRACTICE</div><div class="sub" style="text-align:center">'+exam.value+' · '+chapter.value+' · '+year.value+' · Q'+(i+1)+'</div><div class="lines"></div></div>'});document.getElementById('output').innerHTML=h;window.print()};
opts(exam,exams());if(exams().length){rebuildChapter();dbStatus.textContent='Database loaded: '+exams().map(e=>e+' ('+Object.keys(DATA[e]).length+' chapters)').join(' · ')}else{dbStatus.textContent='Database not loaded. Upload the supplied data.js into this repository.'}
})();</script></body></html>
