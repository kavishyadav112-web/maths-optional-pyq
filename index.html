<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UPSC Mathematics Optional PYQ Hub</title><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#f4f6fa;color:#172033}.wrap{max-width:1050px;margin:auto;padding:28px 16px}.hero{background:linear-gradient(135deg,#172033,#344767);color:#fff;border-radius:20px;padding:28px;margin-bottom:18px}.hero h1{margin:0 0 8px;font-size:28px}.hero p{margin:0;opacity:.85}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 22px #00000010}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}select,input{padding:12px 13px;border:1px solid #ccd3df;border-radius:10px;background:#fff;font-size:15px}input{flex:1;min-width:180px}.years{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.year{padding:16px;border:1px solid #d8deea;border-radius:14px;background:#fafbfe;cursor:pointer}.year:hover,.year.active{background:#eef2ff;border-color:#8da2d8}.year b{font-size:20px}.muted{color:#687386}.result{margin-top:20px;border-top:1px solid #e7eaf0;padding-top:18px}.paper{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:15px 0;border-bottom:1px solid #eee}.paper:last-child{border-bottom:0}.btn{display:inline-block;text-decoration:none;background:#172033;color:#fff;padding:10px 14px;border-radius:9px;font-size:14px}.note{font-size:13px;color:#687386;margin-top:16px;line-height:1.5}.badge{font-size:12px;padding:4px 8px;border-radius:20px;background:#edf2f7;color:#536174;margin-left:7px}.empty{padding:20px 0;color:#687386}</style></head><body><div class="wrap"><div class="hero"><h1>UPSC Mathematics Optional PYQ Hub</h1><p>Year-wise Mathematics Optional previous-year papers · Paper I & Paper II · Official UPSC sources</p></div><div class="card"><div class="controls"><select id="paper"><option value="all">Both Papers</option><option value="1">Paper I</option><option value="2">Paper II</option></select><input id="search" placeholder="Search year (e.g. 2024)"></div><div id="years" class="years"></div><div id="result" class="result"><div class="empty">Select a year to view its Mathematics Optional papers.</div></div><div class="note">PDF links point to UPSC-hosted question papers. For 2019–2013, the official UPSC archive is provided.</div></div></div><script>const archive='https://www.upsc.gov.in/examinations/previous-question-papers/archives';const papers={2026:{1:'https://www.upsc.gov.in/examinations/Civil%20Services%20%28Main%29%20Examination%2C%202026',2:'https://www.upsc.gov.in/examinations/Civil%20Services%20%28Main%29%20Examination%2C%202026'},2025:{1:'https://www.upsc.gov.in/sites/default/files/MATHEMATICS-PAPER%20I-QP-CSM-25-010925.pdf',2:'https://www.upsc.gov.in/sites/default/files/MATHEMATICS-PAPER-II-QP-CSM-25-010925.pdf'},2024:{1:'https://www.upsc.gov.in/sites/default/files/QP-CSM-24-MATHEMATICS-PAPER-I-031024.pdf',2:'https://www.upsc.gov.in/sites/default/files/QP-CSM-24-MATHEMATICS-PAPER-II-031024.pdf'},2023:{1:'https://www.upsc.gov.in/sites/default/files/QP-CSM-23-MATHEMATICS-PAPER-I-29092023.pdf',2:'https://www.upsc.gov.in/sites/default/files/QP-CSM-23-MATHEMATICS-PAPER-II-29092023.pdf'},2022:{1:'https://www.upsc.gov.in/sites/default/files/QP-CSM-22-MATHEMATICS-PAPER-I-280922.pdf',2:'https://www.upsc.gov.in/sites/default/files/QP-CSM-22-MATHEMATICS-PAPER-II-280922.pdf'},2021:{1:'https://www.upsc.gov.in/sites/default/files/Mathematics%20Paper-I.pdf',2:'https://www.upsc.gov.in/sites/default/files/Mathematics%20Paper-II.pdf'},2020:{1:'https://www.upsc.gov.in/sites/default/files/QP-CSM19-Mathematics-I.pdf',2:'https://www.upsc.gov.in/sites/default/files/QP-CSM19-Mathematics-II.pdf'}};const years=Array.from({length:14},(_,i)=>2026-i);const root=document.getElementById('years'),result=document.getElementById('result');let selected=null;function renderYears(){const q=document.getElementById('search').value.trim();root.innerHTML=years.filter(y=>!q||String(y).includes(q)).map(y=>`<div class="year ${selected===y?'active':''}" onclick="show(${y})"><b>${y}</b><br><span class="muted">Paper I & II</span></div>`).join('')}function show(y){selected=y;renderYears();const filter=document.getElementById('paper').value;const ps=filter==='all'?[1,2]:[Number(filter)];result.innerHTML=`<h2 style="margin-top:0">${y} Mathematics Optional</h2>`+ps.map(p=>{const url=(papers[y]&&papers[y][p])||archive;const direct=!!(papers[y]&&papers[y][p]);return `<div class="paper"><div><strong>Paper ${p}</strong><span class="badge">${direct?'UPSC source':'UPSC archive'}</span></div><a class="btn" href="${url}" target="_blank" rel="noopener">Open Paper</a></div>`}).join('')+(y<=2019?`<div class="note">Use the official archive to select the ${y} Mathematics Paper I/II entry.</div>`:'')}document.getElementById('search').oninput=()=>{selected=null;renderYears();result.innerHTML='<div class="empty">Select a year to view its Mathematics Optional papers.</div>'};document.getElementById('paper').onchange=()=>{if(selected)show(selected)};renderYears();</script></body></html>
