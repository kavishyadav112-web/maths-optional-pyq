<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UPSC Mathematics Optional PYQ Generator</title><style>body{font-family:Arial;margin:0;background:#f4f6fa;color:#172033}.wrap{max-width:1050px;margin:auto;padding:18px}.hero{background:#172033;color:white;padding:28px;border-radius:18px}.card{background:white;padding:20px;border-radius:18px;margin-top:16px}select,input,button{font-size:16px;padding:13px;border-radius:10px;border:1px solid #ccd3df}select,input{width:100%;box-sizing:border-box}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.actions{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}button{background:#172033;color:white;cursor:pointer}.light{background:#edf1f7;color:#172033}.q{display:block;border:1px solid #ddd;border-radius:10px;padding:14px;margin:8px 0}.meta{display:block;color:#687386;font-size:13px;margin-top:5px}.status{color:#687386;margin:10px 0}.print{display:none}.page{page-break-after:always;min-height:270mm;padding:15mm}.answer{text-align:center;font-weight:bold;font-size:20px}.lines{height:225mm;margin-top:25px;background:repeating-linear-gradient(#fff 0,#fff 8.9mm,#ddd 9mm)}@media(max-width:700px){.controls{grid-template-columns:1fr}}@media print{@page{size:A4;margin:0}.no-print,.hero{display:none}.print{display:block}}</style></head><body><div class="wrap"><div class="hero"><h1>UPSC Mathematics Optional PYQ Generator</h1><p>CSE + IFoS · Chapterwise · Year-wise · Individual PYQs · Question-cum-answer practice booklet</p></div><div class="card no-print"><div class="controls"><select id="exam"><option>CSE</option><option>IFoS</option></select><select id="chapter"></select><select id="year"></select><select id="paper"><option>Paper I</option><option>Paper II</option></select></div><input id="search" placeholder="Search question number / topic..." style="margin-top:10px"><div class="actions"><button class="light" id="all">Select all shown</button><button class="light" id="clear">Clear</button><button id="gen">Generate Practice Paper</button></div><div id="status" class="status"></div><div id="qs"></div><div id="db" class="status"></div></div><div id="out" class="print"></div></div><script src="data.js"></script><script>
const fallback={CSE:{"Linear Algebra":{"2023":[{id:"CSE-LA-2023-1",q:"Let V1=(2,-1,3,2), V2=(-1,1,1,-3) and V3=(1,1,9,-5). Does (3,-1,0,-1) belong to span{V1,V2,V3}? Justify your answer.",marks:10},{id:"CSE-LA-2023-2",q:"Find the rank and nullity of the linear transformation T:R3→R3 given by T(x,y,z)=(x+z,x+y+2z,2x+y+3z).",marks:10}]}} ,IFoS:{"Linear Algebra":{"2023":[{id:"IFOS-LA-2023-1",q:"Let V be a vector space of dimension n over a field F. Show that V is isomorphic to F^n.",marks:8}]}}};
const DATA=(window.PYQ_DATA&&Object.keys(window.PYQ_DATA).length)?window.PYQ_DATA:fallback;let selected=new Set();const E=document.getElementById('exam'),C=document.getElementById('chapter'),Y=document.getElementById('year'),P=document.getElementById('paper'),S=document.getElementById('search'),Q=document.getElementById('qs'),ST=document.getElementById('status');function fill(x,a){x.innerHTML='';a.forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;x.appendChild(o)})}function chapters(){return Object.keys(DATA[E.value]||{})}function years(){return Object.keys((DATA[E.value]||{})[C.value]||{}).sort((a,b)=>+b-+a)}function list(){return ((DATA[E.value]||{})[C.value]||{})[Y.value]||[]}function setup(){fill(C,chapters());fill(Y,years());selected.clear();render()}function render(){let t=S.value.toLowerCase(),a=list(),h='';a.forEach((q,i)=>{if(t&&!(q.q||'').toLowerCase().includes(t)&&!(q.id||'').toLowerCase().includes(t))return;h+='<label class="q"><input type="checkbox" data-id="'+q.id+'" '+(selected.has(q.id)?'checked':'')+'> <b>Q'+(i+1)+'</b> '+q.q+'<span class="meta">'+E.value+' · '+C.value+' · '+Y.value+' · '+(q.marks||'')+' Marks</span></label>'});Q.innerHTML=h||'<div class="status">No questions for this selection.</div>';ST.textContent=selected.size+' selected · '+a.length+' available';Q.querySelectorAll('input').forEach(x=>x.onchange=()=>{x.checked?selected.add(x.dataset.id):selected.delete(x.dataset.id);render()});document.getElementById('db').textContent=(window.PYQ_DATA&&Object.keys(window.PYQ_DATA).length)?'Full database loaded from data.js.':'Database file is not yet installed; showing test data so the interface remains usable.'}E.onchange=setup;C.onchange=()=>{fill(Y,years());selected.clear();render()};Y.onchange=()=>{selected.clear();render()};S.oninput=render;document.getElementById('all').onclick=()=>{list().forEach(q=>selected.add(q.id));render()};document.getElementById('clear').onclick=()=>{selected.clear();render()};document.getElementById('gen').onclick=()=>{let a=list().filter(q=>selected.has(q.id));if(!a.length)return alert('Select at least one question.');document.getElementById('out').innerHTML=a.map((q,i)=>'<div class="page"><h2>UPSC Mathematics Optional</h2><p>'+E.value+' · '+C.value+' · '+Y.value+' · '+P.value+'</p><h3>Q'+(i+1)+'</h3><div style="font-size:18px;line-height:1.7">'+q.q+'</div><p>['+q.marks+' Marks]</p></div><div class="page"><div class="answer">ANSWER / PRACTICE</div><div class="lines"></div></div>').join('');window.print()};setup();</script></body></html>
