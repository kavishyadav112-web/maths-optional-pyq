<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UPSC Mathematics Optional PYQ Generator</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.hero{background:#172033;color:#fff;padding:28px;border-radius:16px;margin-bottom:16px}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;font-size:15px}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 3px 16px #0001}.controls{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}select,input{width:100%;padding:13px;border:1px solid #ccd3df;border-radius:10px;font-size:16px;background:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.btn{border:0;border-radius:10px;padding:13px 17px;background:#172033;color:#fff;font-size:15px}.light{background:#edf1f7;color:#172033}.q{display:block;border:1px solid #dfe3ea;border-radius:10px;padding:15px;margin:9px 0;cursor:pointer;font-size:16px;line-height:1.55}.q input{width:auto;margin-right:8px}.meta{display:block;margin:6px 0 0 25px;color:#687386;font-size:13px}.status{font-size:14px;color:#687386;margin-top:10px}.print{display:none}.page{page-break-after:always;min-height:270mm;padding:15mm}.page:last-child{page-break-after:auto}.head{text-align:center;margin-bottom:35px}.head h1{font-size:21px}.sub{font-size:13px;color:#555}.question{font-size:18px;line-height:1.7}.marks{text-align:right;font-size:14px;margin-top:20px}.answer{text-align:center;font-weight:bold;font-size:19px}.lines{height:225mm;margin-top:25px;border-top:1px solid #ccc;background:repeating-linear-gradient(to bottom,transparent 0,transparent 9mm,#ddd 9.1mm)}@media(max-width:700px){.controls{grid-template-columns:1fr}}@media print{.no-print,.hero{display:none!important}.print{display:block}.wrap{padding:0;max-width:none}@page{size:A4;margin:0}}</style></head><body><div class="wrap"><div class="hero"><h1>UPSC Mathematics Optional PYQ Generator</h1><p>CSE + IFoS · Chapterwise · Year-wise · Select individual PYQs · Generate a question-cum-answer practice booklet</p></div><div class="card no-print"><div class="controls"><select id="exam"><option>CSE</option><option>IFoS</option></select><select id="chapter"><option>Linear Algebra</option></select><select id="year"></select><select id="paper"><option>Paper I</option><option>Paper II</option></select></div><input id="search" placeholder="Search question number / topic..." style="margin-top:10px"><div class="actions"><button class="btn light" id="all">Select all shown</button><button class="btn light" id="clear">Clear</button><button class="btn" id="generate">Generate Practice Paper</button></div><div id="status" class="status"></div><div id="questions"></div><div class="status">Linear Algebra is currently loaded. The remaining chapters are being imported from the uploaded IMS compilation.</div></div><div id="output" class="print"></div></div><script>const DATA={CSE:{"Linear Algebra":{"2023":[["Q1","Let V1 = (2, –1, 3, 2), V2 = (–1, 1, 1, –3) and V3 = (1, 1, 9, –5) be three vectors of the space R4. Does (3, –1, 0, –1) ∈ span {V1, V2, V3}? Justify your answer.",10],["Q2","Find the rank and nullity of the linear transformation T : R3 → R3 given by T(x, y, z) = (x + z, x + y + 2z, 2x + y + 3z).",10],["Q3","If the matrix of a linear transformation T : R3 → R3 relative to the standard basis is given, find the matrix of T relative to the basis {(1,1,1),(0,1,1),(0,0,1)}.",15],["Q4","Let A = [[1,0,0],[1,0,1],[0,1,0]]. (i) Verify the Cayley-Hamilton theorem for A. (ii) Show that An = An–2 + A2 – I for n ≥ 3. Hence find A40.",20],["Q5","Find the rank of the given matrix A by reducing it to row-reduced echelon form.",15]],"2022":[["Q1","Prove that any set of n linearly independent vectors in a vector space V of dimension n constitutes a basis for V.",10],["Q2","Let T : R2 → R3 be a linear transformation such that T(1,1) = (2,0,3) and T(3,1) = (2,1,8). Find T(2,4).",10],["Q3","Find all solutions to the following system of equations by row-reduced method.",15],["Q4","Let P = {(x,y,z) : x – y – z = 0 and 2x + y – z = 0}. (i) Prove that P is a subspace of R3. (ii) Find a basis and dimension of P.",20],["Q5","Find a linear map T : R2 → R2 which rotates each vector of R2 by an angle θ. Also prove that for θ = π/2, T has no eigenvalue in R.",15]],"2021":[["Q1","If A = [[1,−1,1],[2,−1,0],[1,0,0]], show that A2 = A−1 without finding A−1.",10],["Q2","Find the matrix associated with the linear operator on V3(R) defined by T(a,b,c) = (a+b, a−b, 2c) with respect to the ordered basis B = {(0,1,1),(1,0,1),(1,1,0)}.",10],["Q3","Show that S = {(x,2y,3x) : x,y are real numbers} is a subspace of R3. Find two bases of S and its dimension.",15],["Q4","Prove that the eigenvectors corresponding to two distinct eigenvalues of a real symmetric matrix are orthogonal.",8],["Q5","For two square matrices A and B of order 2, show that trace(AB) = trace(BA). Hence show that AB – BA ≠ I2.",7]],"2020":[["Q1","Consider the set V of all n × n real magic squares. Show that V is a vector space over R. Give examples of two distinct 2 × 2 magic squares.",10],["Q2","Let M2(R) be the vector space of all 2 × 2 real matrices. Suppose T : M2(R) → M2(R) is defined by T(A) = BA. Find the rank and nullity of T and a matrix A which maps to the null matrix.",10],["Q3","Define A = I – 2u·uT, where u is a unit column vector. Examine whether A is symmetric and orthogonal, show trace(A) = n – 2, and find the stated 3 × 3 case.",20],["Q4","Let F be a subfield of complex numbers and T : F3 → F3 be the stated linear transformation. Find the conditions for (a,b,c) to be in the null space of T and find the nullity.",15],["Q5","For the stated 3 × 3 matrices A and B, find AB, det(A), det(B), and solve the given system of equations.",15]],"2019":[["Q1","Let T : R2 → R2 be a linear map such that T(2,1) = (5,7) and T(1,2) = (3,3). If A is the matrix corresponding to T with respect to the standard bases, find rank(A).",10],["Q2","If A and B are the stated 3 × 3 matrices, show that AB = 6I3 and use this result to solve the given system of equations.",10],["Q3","Let A and B be two orthogonal matrices of the same order and det A + det B = 0. Show that A + B is a singular matrix.",15],["Q4","Let A be the stated 4 × 4 matrix. Find the rank of A and the dimension of the subspace defined by Ax = 0.",20],["Q5","State the Cayley-Hamilton theorem. Use it to find A100 for the stated matrix A.",15]],"2018":[["Q1","Let A be a 3×2 matrix and B a 2×3 matrix. Show that C = A·B is a singular matrix.",10],["Q2","Express basis vectors e1=(1,0) and e2=(0,1) as linear combinations of α1=(2,−1) and α2=(1,3).",10],["Q3","Show that if A and B are similar n×n matrices, then they have the same eigenvalues.",12]],"2017":[["Q1","Let A = [[2,2],[1,3]]. Find a non-singular matrix P such that P−1AP is a diagonal matrix.",10],["Q2","Show that similar matrices have the same characteristic polynomial.",10],["Q3","Suppose U and W are distinct four dimensional subspaces of a vector space V, where dim V = 6. Find the possible dimensions of U ∩ W.",10],["Q4","Consider the stated matrix mapping A : R4 → R3. Find a basis and dimension of the image of A and those of the kernel A.",15],["Q5","Prove that distinct non-zero eigenvectors of a matrix are linearly independent.",10]]}},IFoS:{"Linear Algebra":{"2023":[["Q1","Let V be a vector space of dimension n over a field F. Show that V is isomorphic to Fn.",8],["Q2","Let T : R3 → R3 be a linear map defined by T(x,y,z) = (x,z,−2y−z) and let f(u) = −u3 + 2. Find f(T).",8],["Q3","If S1 = {(x,y,z)|x+2y+z=0} and S2 = {(x,y,z)|x+y−z=0} are subspaces of R3, find a basis of S1 ∩ S2, determine dim(S1+S2), and describe them geometrically.",10],["Q4","Let T : R3 → R3 be T(x,y,z) = (2x,4x−y,2x+3y−z). Prove that T is invertible and find T−1.",15],["Q5","Show that the stated matrix A is diagonalizable and find a spectral decomposition of A.",15]],"2022":[["Q1","Let V be the complex vector space of 3 × 3 skew-symmetric matrices with complex entries. Define T(A) = BA – AB. Find the eigenvalues and eigenvectors of T.",15]]}}};let selected=new Set();const $=id=>document.getElementById(id);function getList(){return(DATA[$('exam').value][$('chapter').value][$('year').value]||[])}function fillYears(){let ys=Object.keys(DATA[$('exam').value][$('chapter').value]).sort((a,b)=>+b-+a);$('year').innerHTML=ys.map(y=>`<option>${y}</option>`).join('');selected.clear();render()}function render(){let term=$('search').value.toLowerCase(),rows=getList().filter(q=>(q[0]+' '+q[1]).toLowerCase().includes(term));$('questions').innerHTML=rows.length?rows.map((q,i)=>`<label class="q"><input type="checkbox" data-i="${i}" ${selected.has(q[0])?'checked':''}><b>${q[0]}</b> ${q[1]}<span class="meta">${$('exam').value} · ${$('chapter').value} · ${$('year').value} · ${q[2]} marks</span></label>`).join(''):'<div class="status">No questions are loaded for this selection.</div>';$('status').textContent=selected.size+' question(s) selected';document.querySelectorAll('.q input').forEach(cb=>cb.onchange=()=>{let q=rows[+cb.dataset.i];cb.checked?selected.add(q[0]):selected.delete(q[0]);$('status').textContent=selected.size+' question(s) selected'})}function all(){getList().forEach(q=>selected.add(q[0]));render()}function clear(){selected.clear();render()}function generate(){let rows=getList().filter(q=>selected.has(q[0]));if(!rows.length){alert('Select at least one question.');return}let h='';rows.forEach(q=>h+=`<div class="page"><div class="head"><h1>UPSC Mathematics Optional</h1><div class="sub">${$('exam').value} · ${$('chapter').value} · ${$('year').value}</div></div><div class="question"><b>${q[0]}</b><br>${q[1]}</div><div class="marks">[${q[2]} Marks]</div></div><div class="page"><div class="answer">ANSWER / PRACTICE</div><div class="sub" style="text-align:center">${$('exam').value} · ${$('chapter').value} · ${$('year').value} · ${q[0]}</div><div class="lines"></div></div>`);$('output').innerHTML=h;window.print()}$('exam').onchange=()=>{selected.clear();fillYears()};$('year').onchange=()=>{selected.clear();render()};$('search').oninput=render;$('all').onclick=all;$('clear').onclick=clear;$('generate').onclick=generate;fillYears();</script></body></html>
